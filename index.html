
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ミッション5-1</title>
</head>
<body>
<h1>大阪の明日の天気</h1>
<div id="osakatennki"></div>
<script>
const url = "https://weather.tsukumijima.net/api/forecast/city/270000"
fetch(url)
.then(response => response.json())
.then(data => {
const tomorrow = data.forecasts[1];
const weather  = tomorrow.telop; 
const maxTemp  = tomorrow.temperature.max?.celsius ?? "ー";
const minTemp  = tomorrow.temperature.min?.celsius ?? "ー";
const html=
`
<p>地域：${data.location.city}（${data.location.prefecture}）</p>
<p>天気：${weather}</p>
<p>最高気温：${maxTemp}℃</p>
<p>最低気温：${minTemp}℃</p>
<img src="${tomorrow.image.url}" alt="${tomorrow.image.title}">
`
; 
document.getElementById("osakatennki").innerHTML = html;
})
.catch(error => {
document.getElementById("osakatennki").innerHTML = "データ取得に失敗しました💦";
console.error(error);
});
</script>
</body>
</html>
